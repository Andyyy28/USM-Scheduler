x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
  DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
  POSTGRES_DB: ${POSTGRES_DB:-usm_scheduler}
  POSTGRES_USER: ${POSTGRES_USER:-usm_scheduler}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usm_scheduler_dev}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_TASK_TIME_LIMIT: "1860"
  CELERY_VISIBILITY_TIMEOUT_SECONDS: "2100"
  SCHEDULE_RUN_INFRASTRUCTURE_GRACE_SECONDS: "60"
  SOLVER_DEFAULT_TIME_LIMIT_SECONDS: ${SOLVER_DEFAULT_TIME_LIMIT_SECONDS:-300}
  SOLVER_MEMORY_LIMIT_MB: ${SOLVER_MEMORY_LIMIT_MB:-2048}
  APP_BUILD_ID: ${APP_BUILD_ID:-local-development}
  SOURCE_COMMIT: ${SOURCE_COMMIT:-uncommitted}
  CONTAINER_IMAGE_ID: ${CONTAINER_IMAGE_ID:-usm-scheduler:local}

x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_BUILD_ID: ${APP_BUILD_ID:-local-development}
      SOURCE_COMMIT: ${SOURCE_COMMIT:-uncommitted}
  image: usm-scheduler:local
  environment: *app-environment
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usm_scheduler}
      POSTGRES_USER: ${POSTGRES_USER:-usm_scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usm_scheduler_dev}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine3.21
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    <<: *app-service
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
    command:
      - gunicorn
      - usm_scheduler.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${WEB_CONCURRENCY:-2}
      - --threads=2
      - --timeout=120
      - --access-logfile=-
      - --error-logfile=-
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    <<: *app-service
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    command: ["celery", "-A", "usm_scheduler", "worker", "--loglevel=INFO", "--hostname=routine@%h", "--queues=default", "--concurrency=1", "--prefetch-multiplier=1"]
    cpus: 1.0
    mem_limit: "${SOLVER_MEMORY_LIMIT_MB:-2048}m"
    stop_grace_period: 70s
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A usm_scheduler inspect ping --destination routine@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  benchmark-worker:
    <<: *app-service
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    command: ["celery", "-A", "usm_scheduler", "worker", "--loglevel=INFO", "--hostname=benchmark@%h", "--queues=benchmark", "--concurrency=1", "--prefetch-multiplier=1", "--max-tasks-per-child=1"]
    cpus: 1.0
    mem_limit: 2048m
    stop_grace_period: 70s
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD-SHELL", "celery -A usm_scheduler inspect ping --destination benchmark@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    <<: *app-service
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    command: ["celery", "-A", "usm_scheduler", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
