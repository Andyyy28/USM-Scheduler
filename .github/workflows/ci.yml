name: CI

on:
  push:
    branches: [main, thesis/experimental-platform-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: usm_scheduler
          POSTGRES_USER: usm_scheduler
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usm_scheduler -d usm_scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.10-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_SECRET_KEY: ci-only-aB9!qL4@vT7#nR2$wX5%zC8^mK1&pH6*eF3-safe-test-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: usm_scheduler
      POSTGRES_USER: usm_scheduler
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"
      APP_BUILD_ID: github-actions-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_COMMIT: ${{ github.sha }}
      CONTAINER_IMAGE_ID: usm-scheduler:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-hashed.txt
            requirements-dev.txt
      - name: Install hash-verified runtime closure
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-hashed.txt
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Audit locked runtime dependencies
        run: >-
          python -m pip_audit
          --requirement requirements-lock.txt
          --no-deps
          --disable-pip
          --progress-spinner off
      - name: Install browser for end-to-end tests
        run: python -m playwright install --with-deps --no-shell chromium firefox
      - name: Lint Python
        run: ruff check .
      - name: Check Django configuration
        run: python manage.py check
      - name: Check production security configuration
        env:
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Validate static asset collection
        run: python manage.py collectstatic --noinput
      - name: Run test suite
        run: pytest --cov=scheduler --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Build runtime image
        run: docker build --tag usm-scheduler:ci --tag usm-scheduler:local .
      - name: Start disposable acceptance stack
        env:
          DJANGO_DEBUG: "true"
          SOURCE_COMMIT: ${{ github.sha }}
          APP_BUILD_ID: github-actions-${{ github.run_id }}
        run: docker compose up --no-build --wait --wait-timeout 150
      - name: Verify real queued solvers and independent persisted validation
        run: docker compose exec -T web python manage.py check_runtime --confirm-empty-database
      - name: Capture container diagnostics
        if: always()
        run: docker compose logs --no-color --tail=200
      - name: Stop disposable acceptance stack
        if: always()
        run: docker compose down --volumes
