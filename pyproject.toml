[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scheduler/migrations/*.py" = ["I001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "usm_scheduler.settings"
testpaths = ["tests"]
